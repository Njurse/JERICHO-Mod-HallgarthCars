id = "hallgarthcars"
name = "Hallgarth's Cars"
version = "0.1.4"
# the JERICHO interface (SDK) this mod is built against
interface = 3
author = "Hallgarth, Njurse; thanks Commando52Colton"
description = "Hallgarth's Pontiac Firebird as a BAKE car bank (HALLCHCG): the updated Firebird model with its own paint pages, wheels and sounds. Clean, damaged and low LODs. Enable and play: carhacks registers the bank on its own (JERICHO 0.13.4+). Older games: add banks/hallchcg/cities.ini to JERICHO/CONFIG/cities.ini."
# data-only vehicle pack: no DLL, nothing compiled (no runtime = "dll")
dependencies = ["carhacks"]
# packbanks (carhacks 0.2.7+) registers HALLCHCG only when this mod is enabled
# (modlist.ini: hallgarthcars = 1). Players turn it on under Mods; leave this false.
default-enabled = false
